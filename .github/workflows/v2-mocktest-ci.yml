name: V2 Mock Test validation
on:
  pull_request:
    branches: [v2-development]
  push:
    branches: [v2-security-integration-review]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Lint Mock Test implementation
        run: npx eslint src/components/TestRunner.tsx src/pages/MockTest.tsx
      - name: Full repository lint (baseline diagnostic)
        continue-on-error: true
        run: npm run lint
